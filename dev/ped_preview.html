<script type="importmap">{"imports":{"three":"../js/lib/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from '../js/lib/addons/environments/RoomEnvironment.js';
import { PedKit } from '../js/streetlife.js';
const q = new URLSearchParams(location.search); const T = +(q.get('t') || 0.3), close = q.has('close');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);

const sc = new THREE.Scene(); sc.background = new THREE.Color(0x9aa4ad); const pm = new THREE.PMREMGenerator(r); sc.environment = pm.fromScene(new RoomEnvironment()).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 6, 5); sc.add(sun); sc.add(new THREE.HemisphereLight(0xcfe0ff, 0x554433, 0.6));

// [hair, outfit, shak]  (shak: Shak's face decal + textured hair + his skin tone)
const looks = [[['hairT'], ['jacket', 'trou', 'slvL'], 1], [['hairL'], ['dress', 'bare', 'slvS']], [['hairT'], ['trou', 'slvS'], 1], [['hairS', 'pony'], ['skirt', 'bare', 'slvL']], [['hijab'], ['jacket', 'skirt', 'bare', 'slvL']], [['hairT', 'cap'], ['hood', 'trou', 'slvL'], 1], [['hairS'], ['jacket', 'trou', 'slvL']], [['hairL', 'bun'], ['trou', 'slvS']], [['hairT'], ['hood', 'trou', 'slvL'], 1]];

const w = new Float32Array(n * 4), m = new Float32Array(n), cs = [0, 1, 2, 3].map(() => new Float32Array(n * 3)), col = new THREE.Color(), d = new THREE.Object3D();
const H = [1.0, 0.95, 1.06, 0.97, 0.94, 0.98, 1.03, 0.96, 0.92];
looks.forEach((L, i) => { m[i] = K.maskOf([...L[0], ...L[1], L[2] ? 'shak' : 'feat', i % 2 ? 'soleD' : 'soleW']); C[i].forEach((h, k) => { if (L[2] && k === 2) h = K.SHAK_SKIN; if (L[2] && k === 3) h = K.HAIR_C; col.set(h); cs[k].set([col.r, col.g, col.b], i * 3); });
  w.set([i * 0.9, q.has('still') ? 0 : 7, L[1].includes('dress') || L[1].includes('skirt') ? 1 : 0.5, 1], i * 4); d.position.set((i - (n - 1) / 2) * 0.9, 0, 0); d.scale.set(1, H[i], H[i]);
  d.rotation.y = q.has('side') ? Math.PI / 2 : q.has('q3') ? 0.6 : close ? 0 : 0.35; d.updateMatrix(); im.setMatrixAt(i, d.matrix); });

</script></body></html>
