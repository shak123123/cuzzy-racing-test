<!doctype html><html><head><base href="../"><style>body{margin:0;background:#222}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./js/lib/three.module.js"}}</script></head><body>
<script type="module">
// Car lineup (dev only): all cars as a grid of tiles, one row per view. ?cars=db9v,...&views=fq,side,rear&w=400&h=225&splitter=1
import * as THREE from 'three';
import { RoomEnvironment } from './js/lib/addons/environments/RoomEnvironment.js';
import { buildCar, setCarEnv } from './js/carmodel.js';
import { registerCars, loadTypes, ensureRealModel } from './js/realcars.js';
try {
const cars = await (await fetch('./shared/cars.json')).json(); registerCars(cars);
const q = new URLSearchParams(location.search); const ids = (q.get('cars') || 'db9v,rrs23,box986,gti8,r8,hurac,avent,f458').split(',');
await loadTypes(); for (const id of ids) await ensureRealModel(id);
const views = (q.get('views') || 'fq,side,rear').split(','); const W = +(q.get('w') || 400), H = +(q.get('h') || 225);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W * ids.length, H * views.length); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.setScissorTest(true);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x9aa3ac);
const pm = new THREE.PMREMGenerator(r); const env = pm.fromScene(new RoomEnvironment(), 0.04).texture; sc.environment = env; setCarEnv(env);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-4, 10, -5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); for (const k of ['left', 'bottom']) sun.shadow.camera[k] = -6; for (const k of ['right', 'top']) sun.shadow.camera[k] = 6; sc.add(sun);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x6d6f72, roughness: 0.55 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; sc.add(fl);
const grid = q.get('grid') ? new THREE.GridHelper(20, 40, 0x222222, 0x444444) : null; if (grid) { grid.position.y = 0.002; sc.add(grid); }
const M = []; window.info = [];
for (const id of ids) { const car = cars.find(c => c.id === id); const opts = { detail: 2, plate: 'CUZZY' }; if (q.get('splitter')) opts.splitter = true; if (q.get('colour')) opts.colour = +q.get('colour');
  const m = buildCar(car, opts); m.visible = false; sc.add(m); m.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(m); M.push({ m, bb, L: bb.max.z - bb.min.z });
  let tris = 0; m.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  window.info.push({ id, key: m.userData.realKey || 'proc', tris: Math.round(tris), size: bb.getSize(new THREE.Vector3()).toArray().map(x => +x.toFixed(3)), bbz: [+bb.min.z.toFixed(3), +bb.max.z.toFixed(3)], warp: m.userData.warp || null, styleMs: m.userData.styleMs }); }
const cam = new THREE.PerspectiveCamera(28, W / H, 0.05, 200);
const V = { fq: [0.62, 1.2, 1.25], rq: [Math.PI - 0.62, 1.3, 1.25], side: [Math.PI / 2, 0.65, 1.2], front: [0, 0.75, 1.25], rear: [Math.PI, 0.85, 1.25], top: [0.6, 4.5, 1.6], low: [0.3, 0.25, 1.1] };
window.draw = () => M.forEach((c, j) => { M.forEach(o => o.m.visible = o === c); views.forEach((v, i) => { const [a, h, d] = V[v] || V.fq; const dist = 5.2 * d;
  cam.position.set(-Math.sin(a) * dist, h, -Math.cos(a) * dist); cam.lookAt(0, 0.55, 0); cam.updateMatrixWorld();
  const y = (views.length - 1 - i) * H; r.setViewport(j * W, y, W, H); r.setScissor(j * W, y, W, H); r.render(sc, cam); }); });
window.cars = M; window.probe = () => M.map(c => { const out = []; c.m.traverse(o => { if (o.isMesh && o.userData.midPart && o.geometry.parameters?.width > 1) { const b = new THREE.Box3().setFromObject(o); out.push([o.geometry.type, b.min.toArray().map(v => +v.toFixed(3)), b.max.toArray().map(v => +v.toFixed(3)), o.parent?.name, o.parent?.position?.toArray(), o.parent?.scale?.toArray()]); } }); return out; });
window.draw();
} catch (e) { window.err = String(e && e.stack || e); }
window.done = true;
</script></body></html>
